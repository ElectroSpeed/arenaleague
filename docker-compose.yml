services:
  db:
    image: postgres:16-alpine
    container_name: arenaleague-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: arenaleague
      POSTGRES_USER: arenaleague
      POSTGRES_PASSWORD: arenaleague
      # Force le tri déterministe : sans cela, l'ordre alphabétique du
      # départage RG-75 dépendrait de la locale du poste hôte.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - arenaleague-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenaleague -d arenaleague"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  arenaleague-data:
